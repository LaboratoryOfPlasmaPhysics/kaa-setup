name: machine_learning
channels:
  - nvidia
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - cxx-compiler
  - fortran-compiler 
  - ccache
  - pip
  - pip:
    - matplotlib>=MIN_MPL_VER
    - ipywidgets==IPW_VER
    - ipympl==IPYMPL_VER
    - pandas_profiling
    - scikit-learn
    - ipyparallel
    - handcalcs 
    - jupyter_bokeh
    - ipykernel
    - pandas
    - scipy
    - seaborn
    - ipyevents
    - numba
    - numexpr
    - scalene
    - "jax[cuda12]"
    - "tensorflow[and-cuda]"
  - cuda
  - cudatoolkit
  - cuda-nvcc
  - cudnn
  - cutensor
  - cupy 
  - pytorch
  - pytorch-cuda=12.4
  - torchvision
  - torchaudio
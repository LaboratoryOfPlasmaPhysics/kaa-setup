name: tensorflow
channels:
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - cxx-compiler
  - fortran-compiler 
  - ccache
  - pip
  - pip:
    - matplotlib>=MIN_MPL_VER
    - ipywidgets==IPW_VER
    - ipympl==IPYMPL_VER
    - pandas_profiling
    - scikit-learn
    - ipyparallel
    - handcalcs 
    - jupyter_bokeh
    - ipykernel
    - pandas
    - scipy
    - seaborn
    - ipyevents
    - "tensorflow[and-cuda]"
    - scalene
